<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#17212c" />
    <meta name="description" content="Rattleworks — a toy-box physics destruction game." />
    <title>Rattleworks</title>
    <script>
      (() => {
        const host = location.hostname;
        if (/(^|\.)yandex\./i.test(host)) {
          document.write('<script src="/sdk.js"><\/script>');
        } else if (/(^|\.)crazygames\./i.test(host)) {
          document.write('<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"><\/script>');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
